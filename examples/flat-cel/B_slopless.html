<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';font-style:italic;font-weight:400;src:url(fraunces-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Bai Jamjuree';font-weight:700;src:url(bai-jamjuree-thai-700-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B}
@font-face{font-family:'Bai Jamjuree';font-weight:700;src:url(bai-jamjuree-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
html,body{margin:0;background:#000}canvas{display:block}
</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ===================== TOKENS (from .art-direction.md) =====================
const P = { ink:'#1F1C22', paper:'#E9DCC2', wall:'#4A4F45', wood:'#8A6A4F', cloth:'#6E7B86', accent:'#F2B544' };
const T = {
  light: { x: 1185, y: 572, color: P.accent },          // desk lamp bulb = the only key light
  shadow: { hueShift: -16, darken: 0.13, castScale: 1.42 },
  cel: { shift: 15 },
  grain: 0.08,
  ease: { enter:[0.16,1,0.3,1], exit:[0.7,0,0.84,0] },
  seed: 41,
};
// ===================== HELPERS =====================
const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex = a => '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h,s,l=(M+m)/2;
  if(M===m){h=s=0}else{const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);
  h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2rgb([h,s,l]){h=((h%360)+360)%360;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]}
const shiftHsl=(hex,{h=0,s=0,l=0})=>{const[H,S,L]=rgb2hsl(hex2rgb(hex));return rgb2hex(hsl2rgb([H+h,Math.max(0,Math.min(1,S+s)),Math.max(0,Math.min(1,L+l))]))};
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t))};
// shadows rotate hue TOWARD cool blue (220°) — not a fixed direction, which turned warm wood red
const shadeOf = (hex,k=1) => { const [h]=rgb2hsl(hex2rgb(hex)); let d=220-h;  // go through green/teal, never through red
  return shiftHsl(hex,{h:Math.sign(d)*Math.min(Math.abs(d),Math.abs(T.shadow.hueShift)*k),l:-T.shadow.darken*k,s:-.03}); };
const lightOf = (hex,amt=.28) => mix(hex,T.light.color,amt);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bezier([x1,y1,x2,y2]){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const e=sx(t)-x;if(Math.abs(e)<1e-5)break;t-=e/dx(t)}return sy(t)}}
const E = { enter: bezier(T.ease.enter), exit: bezier(T.ease.exit) };
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const lp=(A,B,t)=>[lerp(A[0],B[0],t),lerp(A[1],B[1],t)];
const mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k};

const c=document.getElementById('c'), ctx=c.getContext('2d'); const W=1920,H=1080;
const rng = mulberry32(T.seed);

// ---------- static seeded data ----------
const WIN = {x:180,y:130,w:800,h:560};
const drops = Array.from({length:150},()=>({x:WIN.x+rng()*WIN.w*1.15,y:rng()*WIN.h,s:900+rng()*500,len:14+rng()*22,a:.18+rng()*.25}));
const bldgWins = []; for(let r=0;r<3;r++) for(let q=0;q<9;q++){ // architecture = grid, jitter only in size/state
  bldgWins.push({x:WIN.x+40+q*84+rng()*6,y:500+r*68+rng()*4,w:40+rng()*8,h:36,on:rng()<.3,dim:.5+rng()*.5}); }
const leaves = Array.from({length:6},(_,i)=>({x:-30+rng()*240,y:1100,len:260+rng()*160,w:46+rng()*20,r:-0.9+i*0.22+rng()*0.15}));
// grain, seeded
const grain = mk(W,H); { const g=grain.getContext('2d'), id=g.createImageData(W,H), r2=mulberry32(7);
  for(let i=0;i<id.data.length;i+=4){const v=r2()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  g.putImageData(id,0,0); }

// ---------- character (pose p: 0 slumped, 1 upright) ----------
const POSE = {
  hip:[1610,770],
  neck0:[1480,705], neck1:[1540,585],
  ctrl0:[1665,640], ctrl1:[1625,655],
  head0:[1440,688], head1:[1512,518],
  hand0:[1385,762], hand1:[1395,768],
  elbow0:[1575,772], elbow1:[1585,775],
};
function charBack(g,col,p){ // torso + neck (behind desk top)
  const n=lp(POSE.neck0,POSE.neck1,p), cc=lp(POSE.ctrl0,POSE.ctrl1,p), h=POSE.hip;
  g.lineCap='round'; g.strokeStyle=col('cloth'); g.lineWidth=150;
  g.beginPath(); g.moveTo(h[0],h[1]+80); g.quadraticCurveTo(cc[0],cc[1],n[0],n[1]); g.stroke();
}
function charFront(g,col,p){ // arms + head (on top of desk)
  const n=lp(POSE.neck0,POSE.neck1,p), hd=lp(POSE.head0,POSE.head1,p);
  const sh=[n[0]+38,n[1]+34], el=lp(POSE.elbow0,POSE.elbow1,p), hn=lp(POSE.hand0,POSE.hand1,p);
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=col('cloth'); g.lineWidth=52;
  g.beginPath(); g.moveTo(sh[0],sh[1]); g.lineTo(el[0],el[1]); g.lineTo(hn[0],hn[1]); g.stroke();
  g.fillStyle=col('skin'); g.beginPath(); g.ellipse(hn[0]-14,hn[1]-4,26,20,0,0,7); g.fill();
  // neck
  g.strokeStyle=col('skin'); g.lineWidth=34; g.beginPath(); g.moveTo(n[0],n[1]); g.lineTo(lerp(hd[0],n[0],.35),lerp(hd[1],n[1],.35)); g.stroke();
  // head (profile, facing left toward lamp)
  const tilt = lerp(0.9,0.12,p);
  g.save(); g.translate(hd[0],hd[1]); g.rotate(-tilt); g.scale(1.16,1.16);
  g.fillStyle=col('skin'); g.beginPath(); g.ellipse(0,0,54,60,0,0,7); g.fill();
  g.beginPath(); g.moveTo(-50,-4); g.lineTo(-66,12); g.lineTo(-48,18); g.fill(); // nose
  g.fillStyle=col('hair'); g.beginPath(); g.ellipse(10,-16,58,50,0.3,Math.PI*0.95,Math.PI*2.25); g.fill();
  g.beginPath(); g.moveTo(-30,-46); g.quadraticCurveTo(-6,-84,26,-58); g.quadraticCurveTo(4,-54,-30,-46); g.fill(); // tuft
  if(p>0.55){ g.fillStyle=col('eye'); g.beginPath(); g.ellipse(-26,-6,5,lerp(1,6,clamp((p-.55)/.3)),0,0,7); g.fill(); }
  g.restore();
}
const base = { cloth:P.cloth, skin:mix(P.paper,P.wood,.38), hair:P.ink, eye:P.ink };
const colShade = k => k==='eye'?P.ink:(k==='hair'?mix(P.ink,P.wood,.10):k==='skin'?shiftHsl(base.skin,{l:-.13,s:-.05}):shadeOf(base[k],1.3));
const colLit   = k => k==='eye'?P.ink:(k==='hair'?mix(P.ink,P.wood,.30):lightOf(base[k],.22));
// cel-shaded layer: lit = S ∩ (S shifted toward light)
const L1=mk(W,H),L2=mk(W,H),SIL=mk(W,H);
function celLayer(drawFn,p,center){
  const a=L1.getContext('2d'), b=L2.getContext('2d');
  a.clearRect(0,0,W,H); b.clearRect(0,0,W,H);
  drawFn(a,colShade,p); drawFn(b,colLit,p);
  const vx=center[0]-T.light.x, vy=center[1]-T.light.y, len=Math.hypot(vx,vy);
  const dx=vx/len*T.cel.shift, dy=vy/len*T.cel.shift;    // away from light
  b.globalCompositeOperation='destination-in'; b.drawImage(L1,-dx,-dy); b.globalCompositeOperation='source-over';
  a.drawImage(L2,0,0); return L1;
}

// ===================== DRAW =====================
window.draw = function(t){
  // pose timeline: hold slumped → anticipation dip → decisive lift → hold
  let p;
  if(t<0.8) p = 0.012*Math.sin(t*4);
  else if(t<1.1) p = -0.07*E.exit((t-0.8)/0.3);
  else p = lerp(-0.07,1,E.enter(clamp((t-1.1)/0.65)));
  const flick = (t>0.42&&t<0.5)?0.5:1;     // lamp flickers once
  const lit = (hex,a)=>lightOf(hex,a*flick);

  ctx.setTransform(1,0,0,1,0,0); ctx.filter='none'; ctx.globalAlpha=1;
  // ---- wall + banded lamp pool (hard bands, no smooth gradient) ----
  ctx.fillStyle=shadeOf(P.wall,.6); ctx.fillRect(0,0,W,H);
  // directional spill: the shade points DOWN, so the wall gets a cone, not concentric rings
  ctx.fillStyle=lit(P.wall,.07); ctx.beginPath(); ctx.ellipse(T.light.x+60,T.light.y+60,780,520,0,0,7); ctx.fill();
  [[[1120,560],[1250,600],[1820,732],[760,732],.16],[[1150,585],[1235,600],[1560,732],[960,732],.30]].forEach(([a,b,cc,d,k])=>{
    ctx.fillStyle=lit(P.wall,k); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...cc); ctx.lineTo(...d); ctx.fill(); });

  // ---- exterior through window (far: desaturated, slightly soft) ----
  ctx.save(); ctx.beginPath(); ctx.rect(WIN.x,WIN.y,WIN.w,WIN.h); ctx.clip();
  const sky=mix(shadeOf(P.wall,1.8),P.cloth,.25);
  ctx.fillStyle=sky; ctx.fillRect(WIN.x,WIN.y,WIN.w,WIN.h);
  ctx.fillStyle=mix(sky,P.paper,.06); ctx.fillRect(WIN.x,WIN.y+WIN.h*.38,WIN.w,WIN.h); // banded haze
  ctx.filter='blur(1.4px)';
  const bld=mix(shadeOf(P.wall,2.2),sky,.35);
  ctx.fillStyle=bld; ctx.fillRect(WIN.x,WIN.y+190,WIN.w,WIN.h);
  bldgWins.forEach(w=>{ctx.fillStyle=w.on?mix(bld,P.paper,.30*w.dim):mix(bld,sky,.45);ctx.fillRect(w.x,w.y,w.w,w.h)});
  // laundry sign on the building plane (skewed), lit by its own tube only
  ctx.save(); ctx.transform(1,-0.07,0,1,0,0); ctx.translate(0,40);
  ctx.fillStyle=mix(bld,P.paper,.10); ctx.fillRect(388,348,452,108);           // hard 1-band spill on facade
  ctx.fillStyle=shadeOf(P.ink,.3); ctx.fillRect(404,360,420,84);
  ctx.font='700 54px "Bai Jamjuree"'; ctx.textBaseline='middle';
  const signCol=mix(P.paper,P.cloth,.48)  /* dimmed: was competing with the focal point */, txt='ซักผ้า 24 ชม.';
  let x=432; for(const ch of ['ซัก','ผ้า',' 24 ชม.']){ // whole syllables only (keeps Thai marks shaped); one flickers
    ctx.fillStyle = ch==='ผ้า' && (Math.floor(t*7)%3===0) ? mix(signCol,P.ink,.6) : signCol;
    ctx.fillText(ch,x,404); x+=ctx.measureText(ch).width; }
  ctx.restore();
  ctx.filter='none';
  // rain (seeded, one wind angle)
  ctx.strokeStyle=mix(sky,P.paper,.55); ctx.lineWidth=2;
  drops.forEach(d=>{const y=WIN.y+((d.y+d.s*t)%(WIN.h+60))-30, x=d.x-(y-WIN.y)*.14;
    ctx.globalAlpha=d.a; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-d.len*.14,y+d.len); ctx.stroke();});
  ctx.globalAlpha=1; ctx.restore();
  // window frame: light-facing (right) edges lit, far edges shaded
  const fr=mix(P.paper,P.wall,.5);
  ctx.fillStyle=shadeOf(fr,1); ctx.fillRect(WIN.x-22,WIN.y-22,WIN.w+44,22); ctx.fillRect(WIN.x-22,WIN.y,22,WIN.h);
  ctx.fillStyle=lit(fr,.25); ctx.fillRect(WIN.x+WIN.w,WIN.y-22,22,WIN.h+22); ctx.fillRect(WIN.x+WIN.w/2-9,WIN.y,18,WIN.h);
  ctx.fillStyle=lit(fr,.12); ctx.fillRect(WIN.x-40,WIN.y+WIN.h,WIN.w+80,26);  // sill
  ctx.fillStyle=shadeOf(fr,1.2); ctx.fillRect(WIN.x-40,WIN.y+WIN.h+26,WIN.w+80,10);

  // ---- big cast shadow of character on wall (projected from the lamp) ----
  const sctx=SIL.getContext('2d'); sctx.clearRect(0,0,W,H);
  charBack(sctx,()=>'#000',p); charFront(sctx,()=>'#000',p);
  sctx.globalCompositeOperation='source-in'; sctx.fillStyle=shadeOf(lit(P.wall,.2),1.6); sctx.fillRect(0,0,W,H); sctx.globalCompositeOperation='source-over';
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,732); ctx.clip();
  const k=T.shadow.castScale; ctx.translate(T.light.x,T.light.y); ctx.scale(k,k); ctx.translate(-T.light.x,-T.light.y+18);
  ctx.drawImage(SIL,0,0); ctx.restore();

  // ---- character back layer (torso) ----
  ctx.drawImage(celLayer(charBack,p,[1600,680]),0,0);

  // ---- desk ----
  ctx.fillStyle=lit(P.wood,.12); ctx.beginPath(); ctx.moveTo(860,730); ctx.lineTo(W,730); ctx.lineTo(W,800); ctx.lineTo(815,800); ctx.fill();
  [[300,90,.22],[190,58,.40]].forEach(([rx,ry,a])=>{ctx.save();ctx.beginPath();ctx.moveTo(860,730);ctx.lineTo(W,730);ctx.lineTo(W,800);ctx.lineTo(815,800);ctx.clip();
    ctx.fillStyle=lit(P.wood,a);ctx.beginPath();ctx.ellipse(T.light.x+70,772,rx,ry,0,0,7);ctx.fill();ctx.restore();});
  ctx.fillStyle=shadeOf(P.wood,1.4); ctx.fillRect(815,800,W-815,280);                    // front face, away from lamp
  ctx.fillStyle=shadeOf(P.wood,2.1); ctx.fillRect(815,800,W-815,10);                     // lip
  // notebook on desk
  ctx.fillStyle=lit(P.paper,.15); ctx.beginPath(); ctx.moveTo(1270,742);ctx.lineTo(1520,742);ctx.lineTo(1540,790);ctx.lineTo(1250,790);ctx.fill();
  ctx.strokeStyle=shadeOf(P.paper,1.2); ctx.lineWidth=2; for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(1290+i*4,752+i*9);ctx.lineTo(1470+i*4,752+i*9);ctx.stroke();}
  // mug + contact shadow (away from lamp → right)
  ctx.fillStyle=shadeOf(P.wood,2.2); ctx.beginPath(); ctx.ellipse(1752,782,48,10,0,0,7); ctx.fill();
  ctx.fillStyle=shadeOf(P.cloth,.8); ctx.fillRect(1700,712,56,70); ctx.fillStyle=lit(P.cloth,.25); ctx.fillRect(1700,712,22,70);
  ctx.fillStyle=shadeOf(P.cloth,1.5); ctx.beginPath(); ctx.ellipse(1728,712,28,7,0,0,7); ctx.fill();

  // ---- lamp ----
  ctx.fillStyle=shadeOf(P.wood,2.4); ctx.beginPath(); ctx.ellipse(1150,776,70,12,0,0,7); ctx.fill(); // contact shadow
  ctx.fillStyle=P.ink; ctx.beginPath(); ctx.ellipse(1135,768,52,11,0,0,7); ctx.fill();
  ctx.strokeStyle=P.ink; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(1135,764); ctx.lineTo(1095,628); ctx.lineTo(1160,548); ctx.stroke();
  ctx.fillStyle=P.ink; ctx.beginPath(); ctx.moveTo(1135,520); ctx.lineTo(1188,532); ctx.lineTo(1232,600); ctx.lineTo(1158,606); ctx.fill();
  ctx.fillStyle=flick<1?mix(P.accent,P.ink,.5):P.accent; ctx.beginPath(); ctx.ellipse(1195,603,37,9,-.08,0,7); ctx.fill();

  // ---- character front layer (arms + head) ----
  ctx.drawImage(celLayer(charFront,p,[1500,650]),0,0);

  // ---- foreground plant (cropped, darkest, out of focus) ----
  ctx.filter='blur(3px)'; ctx.fillStyle=P.ink;
  leaves.forEach(l=>{ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(l.w,-l.len*.5,0,-l.len);ctx.quadraticCurveTo(-l.w,-l.len*.5,0,0);ctx.fill();ctx.restore();});
  ctx.filter='none';

  // ---- caption system: bottom-left, Fraunces italic, staggered words, no shadow ----
  ctx.font='italic 400 54px "Fraunces"'; ctx.textBaseline='alphabetic';
  let cx=140; ['Day','41.','Still','here.'].forEach((w,i)=>{
    const u=E.enter(clamp((t-2.6-i*0.09)/0.6)); ctx.globalAlpha=u; ctx.fillStyle=P.paper;
    ctx.fillText(w,cx,990+(1-u)*16); cx+=ctx.measureText(w+' ').width; });
  ctx.globalAlpha=1;

  // ---- grain ----
  ctx.globalCompositeOperation='soft-light'; ctx.globalAlpha=T.grain*2.2; ctx.drawImage(grain,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
};
document.fonts.load('italic 54px "Fraunces"').then(()=>document.fonts.load('700 54px "Bai Jamjuree"','ซักผ้า')).then(()=>{draw(0);window.ready=true;});
</script></body></html>
